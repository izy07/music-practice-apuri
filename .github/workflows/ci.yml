name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # テストジョブ（データベースなし）
  test:
    name: テスト実行（単体テスト）
    runs-on: ubuntu-latest
    
    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: |
          echo "📦 依存関係をインストールします..."
          npm ci --legacy-peer-deps || {
            echo "❌ 依存関係のインストールに失敗しました"
            echo "📊 package-lock.jsonの整合性を確認してください"
            exit 1
          }
          echo "✅ 依存関係のインストールが完了しました"

      - name: テスト実行（モック使用）
        run: |
          echo "🧪 テストを実行します..."
          npm run test:ci 2>&1 | tee /tmp/test-output.log || {
            echo "❌ テストが失敗しました"
            echo "📊 テスト結果の最後の50行:"
            tail -50 /tmp/test-output.log || echo "ログファイルが見つかりません"
            echo "📊 カバレッジレポート:"
            if [ -f coverage/lcov.info ]; then
              echo "カバレッジファイルが生成されました"
            else
              echo "⚠️ カバレッジファイルが生成されませんでした"
            fi
            exit 1
          }
          echo "✅ テストが完了しました"
        env:
          NODE_ENV: test
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        timeout-minutes: 15

      - name: カバレッジレポートのアップロード
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 統合テスト（モックベース：Supabase不要）
  test-integration:
    name: 統合テスト
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'failure')
    continue-on-error: true  # このジョブが失敗してもCI/CD全体は成功とする

    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: |
          echo "📦 依存関係をインストールします..."
          npm ci --legacy-peer-deps || {
            echo "❌ 依存関係のインストールに失敗しました"
            exit 1
          }
          echo "✅ 依存関係のインストールが完了しました"

      - name: 統合テスト実行（モックベース）
        run: |
          echo "🧪 統合テストを実行します（モックベース、データベース不要）..."
          
          # 統合テストファイルの確認
          if [ -d __tests__/integration ]; then
            echo "📊 統合テストファイル一覧:"
            ls -la __tests__/integration/ || echo "統合テストディレクトリが見つかりません"
            echo "📊 統合テストファイル数:"
            find __tests__/integration -name "*.test.ts" -o -name "*.test.tsx" | wc -l
          else
            echo "⚠️ __tests__/integrationディレクトリが存在しません"
            echo "✅ 統合テストファイルがないため、スキップします"
            exit 0
          fi
          
          # 統合テストはモックを使用しているため、Supabaseの起動は不要
          echo "🧪 統合テストを実行中..."
          npm run test:ci -- __tests__/integration/ 2>&1 | tee /tmp/integration-test-output.log || {
            TEST_EXIT_CODE=$?
            echo "⚠️ 統合テストが失敗しました（終了コード: $TEST_EXIT_CODE）"
            echo "📊 テストログの最後の100行:"
            tail -100 /tmp/integration-test-output.log || echo "ログファイルが見つかりません"
            echo "⚠️ 統合テストが失敗しましたが、CI/CD全体は続行します"
            exit 0
          }
          echo "✅ 統合テストが完了しました"
        env:
          NODE_ENV: test
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        timeout-minutes: 10
        continue-on-error: true

  # Lint チェック
  lint:
    name: コード品質チェック
    runs-on: ubuntu-latest
    
    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: |
          echo "📦 依存関係をインストールします..."
          npm ci --legacy-peer-deps || {
            echo "❌ 依存関係のインストールに失敗しました"
            echo "📊 package-lock.jsonの整合性を確認してください"
            exit 1
          }
          echo "✅ 依存関係のインストールが完了しました"

      - name: 型チェック
        run: |
          echo "🔍 TypeScript型チェックを実行します..."
          npx tsc --noEmit 2>&1 | tee /tmp/tsc-errors.log || {
            echo "❌ 型チェックに失敗しました"
            echo "📊 エラー詳細:"
            cat /tmp/tsc-errors.log | head -50
            exit 1
          }
          echo "✅ 型チェックが完了しました"
        continue-on-error: false

  # ビルドチェック
  build:
    name: ビルド確認
    runs-on: ubuntu-latest
    needs: [test, lint]
    # testとlintの両方が成功した場合のみ実行（失敗時はスキップ）
    if: needs.test.result == 'success' && needs.lint.result == 'success'
    
    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: |
          echo "📦 依存関係をインストールします..."
          echo "📊 現在のディレクトリ: $(pwd)"
          echo "📊 package.jsonの存在確認:"
          ls -la package.json || echo "❌ package.jsonが見つかりません"
          echo "📊 package.jsonのscriptsセクション:"
          cat package.json | grep -A 15 '"scripts"' || echo "❌ scriptsセクションが見つかりません"
          
          # package-lock.jsonの存在確認
          if [ -f package-lock.json ]; then
            echo "✅ package-lock.jsonが存在します"
          else
            echo "⚠️  package-lock.jsonが存在しません。npm installを実行します..."
            npm install --legacy-peer-deps
          fi
          
          npm ci --legacy-peer-deps || {
            echo "❌ npm ciに失敗しました。npm installを試行します..."
            npm install --legacy-peer-deps || {
              echo "❌ 依存関係のインストールに失敗しました"
              echo "📊 package-lock.jsonの整合性を確認してください"
              exit 1
            }
          }
          echo "✅ 依存関係のインストールが完了しました"
          
          echo "📊 インストール後のpackage.jsonスクリプト確認:"
          cat package.json | grep -A 15 '"scripts"' || echo "❌ scriptsセクションが見つかりません"
          echo "📊 利用可能なnpmスクリプト:"
          npm run 2>&1 | head -30 || echo "⚠️  npm runの実行に失敗しましたが、続行します"

      - name: Web ビルド
        run: |
          echo "🏗️ Webビルドを実行します..."
          echo "📊 現在のディレクトリ: $(pwd)"
          echo "📊 環境変数確認:"
          echo "  EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:0:30}..."
          echo "  NODE_ENV: $NODE_ENV"
          
          echo "📊 package.jsonの完全な内容確認:"
          cat package.json || echo "❌ package.jsonの読み込みに失敗"
          
          echo "📊 build:webスクリプトの確認:"
          cat package.json | grep -A 2 '"build:web"' || echo "❌ build:webスクリプトが見つかりません"
          
          echo "📊 利用可能なnpmスクリプト一覧:"
          npm run 2>&1 || echo "⚠️  npm runの実行に失敗"
          
          echo "📊 build:webスクリプトの直接実行:"
          npm run build:web || {
            echo "❌ ビルドに失敗しました"
            echo "📊 デバッグ情報:"
            echo "現在のディレクトリ: $(pwd)"
            echo "package.jsonの存在:"
            ls -la package.json || echo "package.jsonが存在しません"
            echo "package.jsonのscriptsセクション:"
            cat package.json | grep -A 15 '"scripts"' || echo "scriptsセクションが見つかりません"
            echo "distディレクトリの状態:"
            ls -la dist/ 2>&1 || echo "distディレクトリが存在しません"
            echo "web-buildディレクトリの状態:"
            ls -la web-build/ 2>&1 || echo "web-buildディレクトリが存在しません"
            exit 1
          }
          
          echo "✅ ビルドが完了しました"
          echo "📁 ビルド成果物の確認:"
          
          # web-buildディレクトリが存在する場合はdistにコピー
          if [ -d web-build ] && [ ! -d dist ]; then
            echo "📁 web-buildディレクトリをdistにコピーします..."
            cp -r web-build dist
          fi
          
          # distディレクトリが存在しない場合はエラー
          if [ ! -d dist ]; then
            echo "  ❌ distディレクトリが存在しません"
            echo "  📁 web-buildディレクトリの状態:"
            ls -la web-build/ 2>&1 || echo "web-buildディレクトリも存在しません"
            exit 1
          fi
          
          echo "  distディレクトリが存在します"
          ls -la dist/ | head -20
          [ -f dist/index.html ] && echo "  ✅ index.html が存在します" || echo "  ❌ index.html が見つかりません"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://uteeqkpsezbabdmritkn.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0ZWVxa3BzZXpiYWJkbXJpdGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUxNDQyNDUsImV4cCI6MjA3MDcyMDI0NX0.3wITO5E53yW2spDHi99ngaA0SRqnsJbAYzdT7DDa1tM' }}
          NODE_ENV: production
        timeout-minutes: 20

      - name: ビルド成果物のアップロード
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  # セキュリティチェック
  security:
    name: セキュリティ監査
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: Node.js セットアップ
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: |
          echo "📦 依存関係をインストールします..."
          npm ci --legacy-peer-deps || {
            echo "❌ 依存関係のインストールに失敗しました"
            echo "📊 package-lock.jsonの整合性を確認してください"
            exit 1
          }
          echo "✅ 依存関係のインストールが完了しました"

      - name: 脆弱性チェック
        run: npm audit --production
        continue-on-error: true

      - name: テストデータ漏洩チェック
        run: |
          echo "🔍 テストデータの漏洩をチェックします..."
          if grep -r "test@example.com" supabase/migrations/ 2>/dev/null; then
            echo "⚠️ テストデータがマイグレーションに含まれています"
            exit 1
          fi
          echo "✅ テストデータの漏洩なし"
        continue-on-error: false

      - name: 環境変数チェック
        run: |
          echo "🔍 ハードコードされた認証情報をチェックします..."
          if grep -r "testpassword123" app/ components/ lib/ 2>/dev/null; then
            echo "⚠️ ハードコードされたパスワードが検出されました"
            exit 1
          fi
          echo "✅ ハードコードされた認証情報なし"
        continue-on-error: false

