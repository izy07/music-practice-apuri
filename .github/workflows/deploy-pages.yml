name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pagesの自動デプロイを有効化

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true  # 進行中のデプロイをキャンセル（新規デプロイを優先）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        # fetch-depth: 0 を削除（shallow cloneで高速化）

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: |
          echo "📦 依存関係をインストールします..."
          npm ci --legacy-peer-deps || {
            echo "❌ 依存関係のインストールに失敗しました"
            exit 1
          }

      - name: Webビルド（GitHub Pages用）
        run: |
          echo "🔧 ビルドを開始します..."
          # 既存のdistディレクトリをクリーンアップ
          rm -rf dist web-build
          
          # ビルドを実行
          npm run build:web:github
          
          # distディレクトリが存在しない、またはindex.htmlが存在しない場合はエラー
          if [ ! -d dist ] || [ ! -f dist/index.html ]; then
            echo "❌ ビルドが失敗しました（distディレクトリまたはindex.htmlが存在しません）"
            exit 1
          fi
          
          echo "✅ ビルドが完了しました"
        env:
          EXPO_PUBLIC_WEB_BASE: /music-practice-apuri
          GITHUB_PAGES_BASE: /music-practice-apuri
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://uteeqkpsezbabdmritkn.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0ZWVxa3BzZXpiYWJkbXJpdGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUxNDQyNDUsImV4cCI6MjA3MDcyMDI0NX0.3wITO5E53yW2spDHi99ngaA0SRqnsJbAYzdT7DDa1tM' }}
          NODE_ENV: production

      - name: 404.htmlの作成（SPAルーティング用）
        run: |
          echo "🔧 404.htmlを作成します..."
          if [ ! -f dist/index.html ]; then
            echo "❌ index.htmlが見つかりません"
            exit 1
          fi
          node scripts/create-robust-404.js || {
            echo "❌ 404.htmlの作成に失敗しました"
            exit 1
          }
        env:
          GITHUB_PAGES_BASE: /music-practice-apuri
          EXPO_PUBLIC_WEB_BASE: /music-practice-apuri

      - name: .nojekyllファイルの作成
        run: |
          echo "🔧 .nojekyllファイルを作成します..."
          echo "" > dist/.nojekyll

      - name: ビルド成果物のアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        continue-on-error: false

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへのデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: false
