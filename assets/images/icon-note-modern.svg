<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景（白） -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  
  <!-- 2つの8分音符がビームでつながったデザイン -->
  <g transform="translate(512, 512)">
    <!-- 左側の音符 -->
    <g transform="translate(-200, -100)">
      <!-- 音符の頭（楕円、左側に傾斜） -->
      <ellipse cx="0" cy="0" rx="180" ry="120" fill="#4A5568" transform="rotate(-30 0 0)"/>
      
      <!-- 音符の幹（縦線、音符の頭の右端から上に伸びる） -->
      <rect x="140" y="-200" width="40" height="200" fill="#4A5568" rx="20"/>
    </g>
    
    <!-- 右側の音符 -->
    <g transform="translate(200, -50)">
      <!-- 音符の頭（楕円、左側に傾斜） -->
      <ellipse cx="0" cy="0" rx="180" ry="120" fill="#4A5568" transform="rotate(-30 0 0)"/>
      
      <!-- 音符の幹（縦線、音符の頭の右端から上に伸びる） -->
      <rect x="140" y="-150" width="40" height="150" fill="#4A5568" rx="20"/>
    </g>
    
    <!-- ビーム（2つの音符の幹を結ぶ横線、左から右に上がる） -->
    <line x1="-60" y1="-300" x2="340" y2="-200" stroke="#4A5568" stroke-width="50" stroke-linecap="round"/>
  </g>
</svg>
